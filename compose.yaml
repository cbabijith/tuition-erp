services:
  backend:
    image: frappe/erpnext:v15
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis:6379/0
      REDIS_QUEUE: redis:6379/1
      REDIS_SOCKETIO: redis:6379/2
      SOCKETIO_PORT: "9000"
    networks:
      - frappe

  frontend:
    image: frappe/erpnext:v15
    deploy:
      restart_policy:
        condition: on-failure
    command: nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: erpnext.localhost
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
    ports:
      - "8080:8080"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./nginx-header-fix.conf:/etc/nginx/conf.d/header_fix.conf:ro
      - ./frappe.conf:/etc/nginx/conf.d/frappe.conf:ro
    networks:
      - frappe

  websocket:
    image: frappe/erpnext:v15
    deploy:
      restart_policy:
        condition: on-failure
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - frappe

  queue-default:
    image: frappe/erpnext:v15
    deploy:
      restart_policy:
        condition: on-failure
    command: bench worker --queue default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - frappe

  queue-short:
    image: frappe/erpnext:v15
    deploy:
      restart_policy:
        condition: on-failure
    command: bench worker --queue short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - frappe

  queue-long:
    image: frappe/erpnext:v15
    deploy:
      restart_policy:
        condition: on-failure
    command: bench worker --queue long
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - frappe

  scheduler:
    image: frappe/erpnext:v15
    deploy:
      restart_policy:
        condition: on-failure
    command: bench schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - frappe

  db:
    image: mariadb:10.6
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
      - --max-allowed-packet=1G
    environment:
      MYSQL_ROOT_PASSWORD: admin
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frappe

  redis:
    image: redis:6.2-alpine
    deploy:
      restart_policy:
        condition: on-failure
    networks:
      - frappe

volumes:
  sites:
  logs:
  db-data:

networks:
  frappe:
